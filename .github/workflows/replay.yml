name: Replay (Rückblick)

# Manuell: echte Trump-Posts der letzten N Stunden durch die aktuelle Pipeline.
# Keine Einzel-Mails, kein Commit von alerts.db. Optional EINE Sammel-Mail.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Zeitfenster in Stunden'
        default: '72'
      send_mail:
        description: 'Sammel-Mail mit ACTIONABLE/WATCH senden (1/0)'
        default: '0'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Rückblick-Lauf
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_EMAIL:        ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
          REPLAY_HOURS:       ${{ inputs.hours }}
          REPLAY_SEND_MAIL:   ${{ inputs.send_mail }}
        run: python -u replay.py
